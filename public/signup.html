<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Signup</title>
<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding-top:40px;
}
input,button{
width:250px;
padding:10px;
margin:10px;
border:none;
border-radius:8px;
}
button{
background:#ff2e92;
color:white;
font-weight:bold;
}
</style>
</head>
<body>

<h1>Create Account</h1>

<form action="/signup" method="POST">
<input type="text" name="username" placeholder="Username" required><br>
<input type="password" name="password" placeholder="Password" required><br>
<button type="submit">Sign Up</button>
</form>

<br>

<a href="/">Back to Login</a>

</body>
</html>
