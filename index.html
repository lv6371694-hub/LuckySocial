<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuckySocial</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#222;
    padding:15px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:20px auto;
    padding:15px;
}

input,button{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:none;
}

button{
    background:#0095f6;
    color:white;
    font-weight:bold;
}

.post{
    background:#222;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}
</style>
</head>

<body>

<header>LuckySocial 🚀</header>

<div class="container">

<h2>Login</h2>

<input id="username" placeholder="Username">

<button onclick="login()">Login</button>

<div id="feed"></div>

</div>

<script>
function login(){

document.getElementById("feed").innerHTML=`
<div class="post">
<h3>Welcome ${document.getElementById("username").value}</h3>
<p>Your LuckySocial account is working.</p>
</div>
`;

}
</script>

</body>
</html>
