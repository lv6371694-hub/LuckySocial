<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lucky Social</title>

<style>
body{
margin:0;
background:#18191A;
font-family:Arial,sans-serif;
color:white;
}
.header{
background:#242526;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#ff2e92;
}
.container{
width:90%;
max-width:600px;
margin:20px auto;
}
.card{
background:#242526;
padding:15px;
border-radius:12px;
}
textarea{
width:100%;
height:80px;
padding:10px;
border:none;
border-radius:10px;
}
button{
margin-top:10px;
padding:10px 20px;
background:#ff2e92;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
.post{
margin-top:20px;
background:#3A3B3C;
padding:15px;
border-radius:10px;
}
</style>

<script>
let likes=0;

function likePost(){
likes++;
document.getElementById("likes").innerHTML="❤️ Likes: "+likes;
}

function createPost(){
let text=document.getElementById("postText").value;

if(text==""){
alert("Write something!");
return;
}

document.getElementById("feed").innerHTML=
"<div class='post'><h3>Lucky</h3><p>"+text+"</p><button onclick='likePost()'>❤️ Like</button><p id='likes'>❤️ Likes: 0</p></div>";

likes=0;
document.getElementById("postText").value="";
}
</script>

</head>

<body>

<div class="header">Lucky Social 🚀</div>

<div class="container">

<div class="card">
<h2>Create Post</h2>
<textarea id="postText" placeholder="What's on your mind?"></textarea><br>
<button onclick="createPost()">Post</button>
</div>

<div id="feed"></div>

</div>

</body>
</html>
