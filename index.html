<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuckySocial 🚀</title>

<style>
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

header{
background:#222;
padding:15px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:450px;
margin:auto;
padding:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#0095f6;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.post{
background:#222;
padding:15px;
margin-top:15px;
border-radius:10px;
}

.error{
color:red;
margin-top:10px;
}
</style>

</head>
<body>

<header>LuckySocial 🚀</header>

<div class="container">

<h2>Login</h2>

<input id="username" placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">Login</button>

<p class="error" id="msg"></p>

<div id="feed"></div>

</div>

<script>

async function login(){

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

const res=await fetch("/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password
})
});

const data=await res.json();

if(data.success){

loadFeed();

}else{

document.getElementById("msg").innerHTML=data.message;

}

}

async function loadFeed(){

const res=await fetch("/api/posts");

const posts=await res.json();

let html="";

posts.forEach(post=>{

html+=`
<div class="post">
<h3>${post.user}</h3>
<p>${post.text}</p>
❤️ ${post.likes}
</div>
`;

});

document.getElementById("feed").innerHTML=html;

}

</script>

</body>
</html>
